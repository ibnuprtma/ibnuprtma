<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="k8s-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7DD3FC" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="#0A192F" />
  <rect width="800" height="450" fill="url(#k8s-grid)" />

  <!-- Frame Outline -->
  <rect x="25" y="25" width="750" height="400" fill="#0E2342" stroke="#0047FF" stroke-width="2.5" />
  <rect x="25" y="25" width="750" height="38" fill="#0047FF" />

  <!-- Header -->
  <text x="45" y="50" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">KUBERNETES LAB CLUSTER // TOPOLOGY &amp; POD ORCHESTRATION</text>
  <rect x="660" y="33" width="100" height="22" fill="#27C93F" />
  <text x="672" y="48" fill="#0A192F" font-family="monospace" font-size="10" font-weight="bold">HEALTHY: 100%</text>

  <!-- Ingress / Gateway Node -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="160" height="110" fill="#0A192F" stroke="#7DD3FC" stroke-width="2" />
    <rect x="0" y="0" width="160" height="25" fill="#7DD3FC" />
    <text x="12" y="17" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">INGRESS GATEWAY</text>
    <text x="15" y="48" font-family="monospace" font-size="10" fill="#FFFFFF">Nginx Ingress</text>
    <text x="15" y="66" font-family="monospace" font-size="10" fill="#7DD3FC">TLS Termination</text>
    <text x="15" y="84" font-family="monospace" font-size="10" fill="#FFD600">Rate Limiter</text>
    <text x="15" y="100" font-family="monospace" font-size="9" fill="#747688">Port: 80 / 443</text>
  </g>

  <!-- Connective Lines -->
  <line x1="210" y1="140" x2="260" y2="140" stroke="#FFD600" stroke-width="2.5" stroke-dasharray="4" />
  <line x1="260" y1="140" x2="260" y2="240" stroke="#FFD600" stroke-width="2" stroke-dasharray="4" />

  <!-- Worker Node 1: Frontend & Fastify API -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="230" height="150" fill="#0A192F" stroke="#0047FF" stroke-width="2" />
    <rect x="0" y="0" width="230" height="25" fill="#0047FF" />
    <text x="12" y="17" font-family="monospace" font-size="11" fill="#FFFFFF" font-weight="bold">NODE-01 // SERVICES</text>

    <!-- Pod A -->
    <rect x="15" y="38" width="200" height="42" fill="#FEFCE8" stroke="#0A192F" stroke-width="1.5" />
    <text x="25" y="55" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">pod/vue-web-client</text>
    <text x="25" y="70" font-family="monospace" font-size="9" fill="#0047FF">Replicas: 3 | CPU: 4% | RAM: 140MB</text>

    <!-- Pod B -->
    <rect x="15" y="90" width="200" height="42" fill="#FEFCE8" stroke="#0A192F" stroke-width="1.5" />
    <text x="25" y="107" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">pod/fastify-socket-api</text>
    <text x="25" y="122" font-family="monospace" font-size="9" fill="#0047FF">Replicas: 2 | Socket.IO Active: 380</text>
  </g>

  <!-- Connective line to Node 2 -->
  <line x1="490" y1="140" x2="525" y2="140" stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="4" />

  <!-- Worker Node 2: Database & State -->
  <g transform="translate(525, 80)">
    <rect x="0" y="0" width="225" height="150" fill="#0A192F" stroke="#7DD3FC" stroke-width="2" />
    <rect x="0" y="0" width="225" height="25" fill="#7DD3FC" />
    <text x="12" y="17" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">NODE-02 // STATE &amp; DATA</text>

    <!-- Pod C -->
    <rect x="15" y="38" width="195" height="42" fill="#FEFCE8" stroke="#0A192F" stroke-width="1.5" />
    <text x="25" y="55" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">pod/postgres-primary</text>
    <text x="25" y="70" font-family="monospace" font-size="9" fill="#0047FF">PVC: 50GB SSD | Conn: 42 Active</text>

    <!-- Pod D -->
    <rect x="15" y="90" width="195" height="42" fill="#FEFCE8" stroke="#0A192F" stroke-width="1.5" />
    <text x="25" y="107" font-family="monospace" font-size="11" fill="#0A192F" font-weight="bold">pod/redis-pubsub-cache</text>
    <text x="25" y="122" font-family="monospace" font-size="9" fill="#0047FF">Hit Ratio: 98.4% | Memory: 210MB</text>
  </g>

  <!-- Terminal Telemetry Monitor at Bottom -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="700" height="155" fill="#0A192F" stroke="#0047FF" stroke-width="2" />
    <rect x="0" y="0" width="700" height="26" fill="#0047FF" />
    <text x="15" y="18" font-family="monospace" font-size="11" fill="#FFFFFF" font-weight="bold">KUBECTL CLUSTER TELEMETRY MONITOR</text>

    <text x="20" y="52" font-family="monospace" font-size="11" fill="#7DD3FC">$ kubectl get pods -n production -o wide</text>
    <text x="20" y="74" font-family="monospace" font-size="10" fill="#27C93F">NAME                                READY   STATUS    RESTARTS   AGE    IP</text>
    <text x="20" y="92" font-family="monospace" font-size="10" fill="#FFFFFF">vue-web-client-69f84b9c5d-x2m48     1/1     Running   0          18d    10.244.1.42</text>
    <text x="20" y="108" font-family="monospace" font-size="10" fill="#FFFFFF">fastify-socket-api-5c7987b7-j9k21   1/1     Running   0          18d    10.244.1.43</text>
    <text x="20" y="124" font-family="monospace" font-size="10" fill="#FFFFFF">postgres-statefulset-0              1/1     Running   0          45d    10.244.2.15</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#FFD600">&gt; Cluster Status: 3 nodes online &#8226; 0 crash loops &#8226; Auto-scaling enabled [HPA: 2-10]</text>
  </g>
</svg>
